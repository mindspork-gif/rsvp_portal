<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f4f1;
      color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 36px 24px 80px;
    }

    header { width: 80%; max-width: 100%; margin: 0 auto 24px; border-bottom: 1.5px solid #c8c6be; padding-bottom: 18px; }
    .logo-line { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #5a5a55; margin-bottom: 6px; font-weight: 500; }
    h1 { font-size: 26px; font-weight: 600; color: #1a1a18; }
    h1 span { color: #2563eb; }
    .event-name { font-size: 15px; color: #5a5a55; margin-top: 4px; }

    .search-wrap { width: 80%; display: flex; gap: 10px; margin-bottom: 16px; margin-left: auto; margin-right: auto; }
    .search-input { flex: 1; background: #ffffff; border: 1.5px solid #b0aea6; color: #1a1a18; font-size: 18px; padding: 14px 18px; border-radius: 10px; outline: none; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; }
    .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .search-btn { padding: 14px 26px; background: #2563eb; border: none; color: #fff; font-size: 18px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
    .search-btn:hover { background: #1d4ed8; }
    .search-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .clear-btn { padding: 14px 22px; background: transparent; border: 1.5px solid #b0aea6; color: #5a5a55; font-size: 18px; font-weight: 500; border-radius: 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap; display: none; }
    .clear-btn:hover { border-color: #1a1a18; color: #1a1a18; }
    .clear-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }

    .sort-row { width: 80%; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; margin-left: auto; margin-right: auto; }
    .sort-btn { padding: 11px 17px; background: #ffffff; border: 1.5px solid #b0aea6; color: #5a5a55; font-size: 17px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .sort-btn:hover { border-color: #2563eb; color: #2563eb; }
    .sort-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .sort-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .result-count { margin-left: auto; font-size: 14px; color: #5a5a55; }

    .results-list { width: 100%; border: 1.5px solid #c8c6be; border-radius: 10px; overflow: hidden; background: #fff; }
    .result-row { padding: 18px 20px; border-bottom: 1px solid #e0ded8; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.12s; }
    .result-row:last-child { border-bottom: none; }
    .result-row:hover { background: #eff6ff; }
    .result-row:focus { outline: none; background: #eff6ff; }
    .result-field { font-size: 13px; color: #5a5a55; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 6px; }
    .result-colon { font-size: 13px; color: #5a5a55; margin-right: 6px; }
    .result-value { font-size: 18px; font-weight: 600; color: #1a1a18; }
    .result-chevron { font-size: 20px; color: #b0aea6; }
    .new-badge { font-size: 11px; font-variant: small-caps; font-weight: 600; letter-spacing: .1em; color: #b45309; background: #fef3c7; border: 1px solid #d97706; border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
    .new-overlay-badge { display: inline-block; font-size: 13px; font-variant: small-caps; font-weight: 600; letter-spacing: .08em; color: #b45309; background: #fef3c7; border: 1px solid #d97706; border-radius: 6px; padding: 4px 10px; margin-bottom: 14px; }
    .greeted-wrap { display: flex; align-items: center; gap: 12px; background: #fef3c7; border: 1.5px solid #d97706; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; cursor: pointer; transition: all 0.15s; user-select: none; }
    .greeted-wrap.done { background: #f0fdf4; border-color: #16a34a; }
    .greeted-wrap:focus { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .greeted-cb { width: 22px; height: 22px; border: 2px solid #d97706; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 0.15s; background: #fff; }
    .greeted-wrap.done .greeted-cb { background: #16a34a; border-color: #16a34a; color: #fff; }
    .greeted-label { font-size: 15px; font-weight: 500; color: #b45309; }
    .greeted-wrap.done .greeted-label { color: #15803d; }
    .greeted-error { font-size: 13px; color: #b91c1c; font-weight: 500; margin-top: -10px; margin-bottom: 10px; display: none; }
    .greeted-error.show { display: block; }

    .empty-state { width: 100%; text-align: center; padding: 48px 20px; color: #8a8880; font-size: 16px; }
    .loading { text-align: center; padding: 48px 20px; color: #5a5a55; font-size: 16px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #b0aea6; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* OVERLAY */
    .overlay-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); z-index: 50; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
    .overlay-bg.show { display: flex; }
    .overlay-box { background: #ffffff; border-radius: 16px; border: 1.5px solid #c8c6be; padding: 28px; width: 100%; max-width: 680px; position: relative; }

    .overlay-name { font-size: 22px; font-weight: 600; color: #1a1a18; margin-bottom: 14px; }
    .identity-grid { display: grid; grid-template-columns: 90px 1fr; gap: 6px 14px; font-size: 16px; margin-bottom: 20px; }
    .identity-label { color: #5a5a55; font-weight: 500; }
    .identity-value { color: #1a1a18; }

    .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 16px; }
    .badge-pending  { background: #fffbeb; color: #b45309; border: 1px solid #d97706; }
    .badge-accepted { background: #eff6ff; color: #1d4ed8; border: 1px solid #2563eb; }
    .badge-prior    { background: #f0fdf4; color: #15803d; border: 1px solid #16a34a; }

    .section-divider { border: none; border-top: 1px solid #e0ded8; margin: 16px 0; }
    .section-heading { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: #5a5a55; margin-bottom: 10px; }

    .shift-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .shift-btn { padding: 12px 18px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #3a3a36; font-size: 16px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .shift-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .shift-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .shift-btn.worked { background: #eff6ff; border-color: #2563eb; color: #1d4ed8; }

    /* Payment method buttons — 50% taller */
    .payment-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .payment-btn { padding: 17px 18px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #3a3a36; font-size: 16px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
    .payment-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .payment-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .payment-btn.selected { background: #2563eb; border-color: #2563eb; color: #fff; }
    .payment-btn.comp-btn { background: #fffbeb; border-color: #d97706; color: #b45309; }
    .payment-btn.comp-btn.selected { background: #d97706; border-color: #d97706; color: #fff; }

    /* QR */
    .qr-wrap { background: #f5f4f1; border: 1.5px solid #e0ded8; border-radius: 10px; padding: 16px; text-align: center; margin: 14px 0; }
    .qr-wrap img { width: 200px; height: 200px; object-fit: contain; border-radius: 6px; display: block; margin: 0 auto; }
    .qr-placeholder { width: 200px; height: 200px; background: #e8e6df; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #8a8880; margin: 0 auto; }

    /* Amount buttons — doubled size */
    .amount-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .amount-btn { width: 72px; height: 72px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #3a3a36; font-size: 18px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
    .amount-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .amount-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .amount-btn.selected { background: #2563eb; border-color: #2563eb; color: #fff; }

    /* Comp disclaimer */
    .comp-disclaimer { background: #fffbeb; border: 1.5px solid #d97706; border-radius: 10px; padding: 18px; cursor: pointer; transition: all 0.15s; margin: 14px 0; user-select: none; }
    .comp-disclaimer:hover { background: #fef3c7; }
    .comp-disclaimer:focus { outline: 3px solid #fbbf24; outline-offset: 2px; }
    .comp-disclaimer.error { background: #fef2f2; border-color: #dc2626; }
    .comp-disclaimer-title { font-size: 14px; font-weight: 600; color: #b45309; margin-bottom: 6px; }
    .comp-disclaimer.error .comp-disclaimer-title { color: #b91c1c; }
    .comp-disclaimer-body { font-size: 15px; color: #92400e; line-height: 1.6; }
    .comp-disclaimer.error .comp-disclaimer-body { color: #991b1b; }
    .comp-error-msg { font-size: 14px; color: #b91c1c; font-weight: 500; margin-top: 8px; display: none; }
    .comp-error-msg.show { display: block; }

    /* Buttons */
    .btn-checkin { width: 100%; padding: 16px; background: #16a34a; border: none; color: #fff; font-size: 18px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-top: 16px; }
    .btn-checkin:hover { background: #15803d; }
    .btn-checkin:focus { outline: 3px solid #86efac; outline-offset: 2px; }
    .btn-cancel { width: 100%; padding: 14px; background: transparent; border: 1.5px solid #b0aea6; color: #5a5a55; font-size: 17px; font-weight: 500; border-radius: 10px; cursor: pointer; transition: all 0.15s; margin-top: 10px; }
    .btn-cancel:hover { border-color: #1a1a18; color: #1a1a18; }
    .btn-cancel:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }

    /* Comp confirmation popup */
    .comp-popup-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .comp-popup-bg.show { display: flex; }
    .comp-popup { background: #fff; border-radius: 14px; border: 1.5px solid #c8c6be; padding: 28px; width: 100%; max-width: 400px; }
    .comp-popup-title { font-size: 18px; font-weight: 600; color: #1a1a18; margin-bottom: 8px; }
    .comp-popup-body { font-size: 15px; color: #5a5a55; line-height: 1.6; margin-bottom: 20px; }
    .btn-comp-confirm { width: 100%; padding: 16px; background: #d97706; border: none; color: #fff; font-size: 18px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; }
    .btn-comp-confirm:hover { background: #b45309; }
    .btn-comp-confirm:focus { outline: 3px solid #fbbf24; outline-offset: 2px; }

    /* QR Payment overlay */
    .qr-pay-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .qr-pay-bg.show { display: flex; }
    .qr-pay-box { background: #ffffff; border-radius: 20px; border: 1.5px solid #c8c6be; padding: 32px 28px; width: 100%; max-width: 520px; text-align: center; }
    .qr-pay-title { font-size: 13px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #5a5a55; margin-bottom: 20px; }
    .qr-pay-img { width: 380px; height: 380px; max-width: 100%; object-fit: contain; border-radius: 12px; border: 1.5px solid #e0ded8; display: block; margin: 0 auto 24px; }
    .qr-pay-placeholder { width: 380px; height: 380px; max-width: 100%; background: #f5f4f1; border-radius: 12px; border: 1.5px solid #e0ded8; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #8a8880; margin: 0 auto 24px; }
    .qr-pay-amount-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: #5a5a55; margin-bottom: 12px; }
    .qr-pay-amount-btns { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .qr-pay-amount-btn { width: 72px; height: 72px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #3a3a36; font-size: 18px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
    .qr-pay-amount-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .qr-pay-amount-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .qr-pay-amount-btn.selected { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-payment-confirmed { width: 100%; padding: 16px; background: #16a34a; border: none; color: #fff; font-size: 18px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 10px; display: none; }
    .btn-payment-confirmed.show { display: block; }
    .btn-payment-confirmed:hover { background: #15803d; }
    .btn-payment-confirmed:focus { outline: 3px solid #86efac; outline-offset: 2px; }
    .btn-qr-cancel { width: 100%; padding: 13px; background: transparent; border: 1.5px solid #b0aea6; color: #5a5a55; font-size: 16px; font-weight: 500; border-radius: 10px; cursor: pointer; transition: all 0.15s; }
    .btn-qr-cancel:hover { border-color: #1a1a18; color: #1a1a18; }
    .btn-qr-cancel:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }

    .save-indicator { font-size: 14px; color: #16a34a; font-weight: 500; opacity: 0; transition: opacity 0.3s; margin-top: 10px; min-height: 20px; text-align: center; }
    .save-indicator.show { opacity: 1; }

    /* PIN screen */
    .pin-screen { display: flex; position: fixed; inset: 0; background: #f5f4f1; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .pin-box { background: #fff; border: 1.5px solid #c8c6be; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 400px; text-align: center; }
    .pin-logo { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #5a5a55; margin-bottom: 8px; font-weight: 500; }
    .pin-title { font-size: 22px; font-weight: 600; color: #1a1a18; margin-bottom: 6px; }
    .pin-title span { color: #2563eb; }
    .pin-subtitle { font-size: 14px; color: #8a8880; margin-bottom: 28px; }
    .pin-input { width: 100%; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #1a1a18; font-size: 28px; letter-spacing: 0.4em; padding: 14px; border-radius: 10px; outline: none; text-align: center; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; margin-bottom: 16px; }
    .pin-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .pin-submit { width: 100%; padding: 14px; background: #2563eb; border: none; color: #fff; font-size: 17px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
    .pin-submit:hover { background: #1d4ed8; }
    .pin-submit:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .pin-error { font-size: 14px; color: #b91c1c; font-weight: 500; margin-top: 12px; min-height: 20px; }
    .pin-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }

    /* Intro popup */
    .intro-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 400; align-items: center; justify-content: center; padding: 20px; }
    .intro-bg.show { display: flex; }
    .intro-box { background: #fff; border: 1.5px solid #c8c6be; border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; text-align: center; }
    .intro-title { font-size: 14px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #5a5a55; margin-bottom: 6px; }
    .intro-subtitle { font-size: 13px; color: #8a8880; margin-bottom: 20px; }
    .intro-qr-wrap { background: #f5f4f1; border: 1.5px solid #e0ded8; border-radius: 12px; padding: 16px; display: inline-block; margin-bottom: 20px; }
    .intro-qr-img { width: 200px; height: 200px; object-fit: contain; border-radius: 8px; display: block; }
    .intro-divider { border: none; border-top: 1px solid #e0ded8; margin: 4px 0 20px; }
    .intro-opt { width: 100%; padding: 16px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.15s; text-align: center; border: 1.5px solid; margin-bottom: 10px; }
    .intro-opt:last-child { margin-bottom: 0; }
    .intro-opt:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .intro-opt-prior { background: #f0fdf4; border-color: #16a34a; color: #15803d; }
    .intro-opt-prior:hover { background: #dcfce7; }
    .intro-opt-staff { background: #fef2f2; border-color: #dc2626; color: #b91c1c; }
    .intro-opt-staff:hover { background: #fee2e2; }

    /* All Names popup */
    .allnames-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
    .allnames-bg.show { display: flex; }
    .allnames-box { background: #fff; border: 1.5px solid #c8c6be; border-radius: 14px; padding: 24px; width: 100%; max-width: 380px; }
    .allnames-title { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5a5a55; margin-bottom: 16px; }
    .allnames-grid { display: grid; grid-template-columns: 90px 1fr; gap: 10px 14px; font-size: 16px; margin-bottom: 20px; }
    .allnames-label { color: #5a5a55; font-weight: 500; }
    .allnames-value { color: #1a1a18; font-weight: 500; }
    .allnames-btns { display: flex; gap: 8px; }
    .btn-allnames-confirm { flex: 1; padding: 14px; background: #2563eb; border: none; color: #fff; font-size: 16px; font-weight: 600; border-radius: 9px; cursor: pointer; transition: background 0.15s; }
    .btn-allnames-confirm:hover { background: #1d4ed8; }
    .btn-allnames-confirm:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    .btn-allnames-back { padding: 14px 18px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #5a5a55; font-size: 16px; font-weight: 500; border-radius: 9px; cursor: pointer; transition: all 0.15s; }
    .btn-allnames-back:hover { border-color: #1a1a18; color: #1a1a18; }
    .btn-allnames-back:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }
    /* All Names button on result row */
    .all-names-btn { padding: 8px 13px; background: #f5f4f1; border: 1.5px solid #b0aea6; border-radius: 7px; font-size: 13px; font-weight: 500; color: #5a5a55; white-space: nowrap; cursor: pointer; transition: all 0.15s; }
    .all-names-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .all-names-btn:focus { outline: 3px solid #93c5fd; outline-offset: 2px; }

    footer { margin-top: 40px; font-size: 13px; color: #8a8880; text-align: center; }
  </style>
</head>
<body>

  <!-- PIN screen -->
  <div class="pin-screen" id="pin-screen">
    <div class="pin-box">
      <p class="pin-logo">Admin // Check-In</p>
      <h1 class="pin-title">Event <span>Check-In</span></h1>
      <p class="pin-subtitle">Enter your 8-digit access PIN to continue</p>
      <input class="pin-input" type="password" id="pin-input" maxlength="8" placeholder="••••••••" autocomplete="off" inputmode="numeric" pattern="[0-9]*"
        onkeydown="if(event.key==='Enter') submitPin()" />
      <button class="pin-submit" onclick="submitPin()">Unlock</button>
      <p class="pin-error" id="pin-error"></p>
    </div>
  </div>

  <header>
    <div class="logo-line">Admin // Check-In</div>
    <h1>Event <span>Check-In</span></h1>
    <div class="event-name" id="event-name">&nbsp;</div>
  </header>

  <div class="search-wrap">
    <input class="search-input" type="text" id="search"
      placeholder="Fetname, facename, or moniker..."
      autocomplete="off"
      onkeydown="if(event.key==='Enter') doSearch()" />
    <button class="search-btn" onclick="doSearch()">Search</button>
    <button class="clear-btn" id="clear-btn" onclick="clearResults()">Clear</button>
  </div>

  <div class="sort-row" id="sort-row" style="display:none;">
    <button class="sort-btn active" id="sort-fname" onclick="sortBy('fname')">Fetname ↑</button>
    <button class="sort-btn" id="sort-bname" onclick="sortBy('bname')">Facename</button>
    <button class="sort-btn" id="sort-ipname" onclick="sortBy('ipname')">Moniker</button>
    <span class="result-count" id="result-count"></span>
  </div>

  <div style="width:80%;margin-left:auto;margin-right:auto;"><div id="results-container"></div></div>

  <!-- Attendee overlay -->
  <div class="overlay-bg" id="overlay-bg" role="dialog" aria-modal="true">
    <div class="overlay-box" id="overlay-box">
      <div id="overlay-content"></div>
    </div>
  </div>

  <!-- QR Payment overlay -->
  <div class="qr-pay-bg" id="qr-pay-bg" role="dialog" aria-modal="true">
    <div class="qr-pay-box">
      <p class="qr-pay-title">Scan to pay</p>
      <div id="qr-pay-img-wrap"></div>
      <p class="qr-pay-amount-label">Select amount</p>
      <div class="qr-pay-amount-btns" id="qr-pay-amount-btns"></div>
      <button class="btn-payment-confirmed" id="btn-payment-confirmed" onclick="confirmQrPayment()">Payment Confirmed</button>
      <button class="btn-qr-cancel" onclick="closeQrPay()">Cancel</button>
    </div>
  </div>

  <!-- Comp confirmation popup -->
  <div class="comp-popup-bg" id="comp-popup-bg" role="dialog" aria-modal="true">
    <div class="comp-popup" id="comp-popup">
      <p class="comp-popup-title" id="comp-popup-title">Confirm comp</p>
      <p class="comp-popup-body" id="comp-popup-body"></p>
      <button class="btn-comp-confirm" id="btn-comp-confirm" onclick="confirmComp()">Check In Comp</button>
      <button class="btn-cancel" onclick="closeCompPopup()">Cancel</button>
    </div>
  </div>

  <!-- Intro / rules popup for new attendees -->
  <div class="intro-bg" id="intro-bg" role="dialog" aria-modal="true">
    <div class="intro-box">
      <p class="intro-title">New Attendee</p>
      <p class="intro-subtitle">Please have them scan for event rules and map</p>
      <div class="intro-qr-wrap">
        <img class="intro-qr-img" src="intro.pdf" alt="Rules and map QR code"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
        /><div style="display:none;width:200px;height:200px;background:#e8e6df;border-radius:8px;align-items:center;justify-content:center;font-size:13px;color:#8a8880;flex-direction:column;gap:6px;"><span>📄</span><span>intro.pdf</span></div>
      </div>
      <hr class="intro-divider">
      <button class="intro-opt intro-opt-prior" onclick="resolveIntro('prior')" tabindex="0">
        This person is attending with a prior attendee.
      </button>
      <button class="intro-opt intro-opt-staff" onclick="resolveIntro('staff')" tabindex="0">
        This person is NOT attending with a prior attendee.<br>Please locate a staff member.
      </button>
    </div>
  </div>

  <!-- All Names popup -->
  <div class="allnames-bg" id="allnames-bg" role="dialog" aria-modal="true">
    <div class="allnames-box">
      <p class="allnames-title">All Names</p>
      <div class="allnames-grid" id="allnames-grid"></div>
      <div class="allnames-btns">
        <button class="btn-allnames-confirm" id="btn-allnames-confirm" onclick="confirmAllNames()">Confirm</button>
        <button class="btn-allnames-back" onclick="closeAllNames()">Back</button>
      </div>
    </div>
  </div>

  <footer>Check-in portal &mdash; admin use only</footer>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbzR86hw389rrdPFnlOR1l41Vmv9jtRby9yNugMJCpc710tbpX_6Wmzw1YTGUABYLN1nLA/exec';
    var allAttendees = [];
    var currentResults = [];
    var loaded = false;
    var sortField = 'fname';
    var sortDir = 'asc';
    var activeAttendee = null;
    var compAcknowledged = false;
    var selectedPayment = '';
    var qrPayAmount = null;
    var allNamesRow = null;
    var greetedChecked = false;
    var selectedAmount = null;

    var QR_FILES = { Venmo: 'vn.png', CashApp: 'ca.png' };
    var PAYMENT_METHODS = ['Cash', 'Venmo', 'CashApp', 'Comp'];

    function buildUrl(params) {
      return API_URL + '?' + Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function encShift(s) { return s.replace(/[^a-zA-Z0-9]/g,'_'); }

    function loadAttendees(cb) {
      if (loaded) { cb(); return; }
      fetch(buildUrl({ action: 'getAttendees' }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) { showEmpty(data.message); return; }
          document.getElementById('event-name').textContent = data.eventName;
          allAttendees = data.attendees;
          loaded = true;
          cb();
        })
        .catch(function() { showEmpty('Could not load attendees. Check connection.'); });
    }

    function showEmpty(msg) {
      document.getElementById('results-container').innerHTML = '<div class="empty-state">' + esc(msg) + '</div>';
      document.getElementById('sort-row').style.display = 'none';
      document.getElementById('clear-btn').style.display = 'none';
    }

    function doSearch() {
      var q = document.getElementById('search').value.trim().toLowerCase();
      if (!q) {
        document.getElementById('results-container').innerHTML = '';
        document.getElementById('sort-row').style.display = 'none';
        return;
      }
      document.getElementById('results-container').innerHTML = '<div class="loading"><span class="spinner"></span>Searching...</div>';
      loadAttendees(function() {
        var hits = [];
        allAttendees.forEach(function(a) {
          if (a.fname && a.fname.toLowerCase().includes(q)) hits.push({ attendee: a, field: 'fname', value: a.fname, weight: 1 });
          else if (a.bname && a.bname.toLowerCase().includes(q)) hits.push({ attendee: a, field: 'bname', value: a.bname, weight: 2 });
          else if (a.ipname && a.ipname.toLowerCase().includes(q)) hits.push({ attendee: a, field: 'ipname', value: a.ipname, weight: 3 });
        });
        currentResults = hits;
        sortField = 'fname'; sortDir = 'asc';
        updateSortButtons();
        renderResults();
      });
    }

    function sortBy(field) {
      if (sortField === field) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
      else { sortField = field; sortDir = 'asc'; }
      updateSortButtons();
      renderResults();
    }

    function updateSortButtons() {
      ['fname','bname','ipname'].forEach(function(f) {
        var labels = { fname: 'Fetname', bname: 'Facename', ipname: 'Moniker' };
        var btn = document.getElementById('sort-' + f);
        btn.className = 'sort-btn' + (f === sortField ? ' active' : '');
        btn.textContent = labels[f] + (f === sortField ? (sortDir === 'asc' ? ' ↑' : ' ↓') : '');
      });
    }

    function renderResults() {
      var sorted = currentResults.slice().sort(function(a, b) {
        var av = (a.attendee[sortField] || '').toLowerCase();
        var bv = (b.attendee[sortField] || '').toLowerCase();
        var w = a.weight - b.weight;
        if (sortField === 'fname') { if (w !== 0) return w; }
        if (av < bv) return sortDir === 'asc' ? -1 : 1;
        if (av > bv) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });

      document.getElementById('result-count').textContent = sorted.length + ' result' + (sorted.length !== 1 ? 's' : '');
      document.getElementById('sort-row').style.display = sorted.length ? 'flex' : 'none';
      document.getElementById('clear-btn').style.display = sorted.length ? 'block' : 'none';

      if (!sorted.length) {
        document.getElementById('results-container').innerHTML = '<div class="empty-state">No matches found.</div>';
        document.getElementById('clear-btn').style.display = 'none';
        return;
      }

      var fieldLabels = { fname: 'fetname', bname: 'facename', ipname: 'moniker' };
      var html = '<div class="results-list">';
      sorted.forEach(function(hit, i) {
        html += '<div class="result-row" tabindex="0" onclick="openOverlay(' + hit.attendee.row + ')" onkeydown="if(event.key===\'Enter\'||event.key===\' \')openOverlay(' + hit.attendee.row + ')">' +
          '<div>' +
            '<span class="result-field">' + fieldLabels[hit.field] + '</span>' +
            '<span class="result-colon">:</span>' +
            '<span class="result-value">' + esc(hit.value) + '</span>' +
            (hit.attendee.prior === 'no' ? ' <span class="new-badge">new</span>' : '') +
          '</div>' +
          '<span class="result-chevron">›</span>' +
        '</div>';
      });
      html += '</div>';
      document.getElementById('results-container').innerHTML = html;
    }

    function openOverlay(row) {
      activeAttendee = allAttendees.find(function(a) { return a.row === row; });
      if (!activeAttendee) return;
      compAcknowledged = false;
      greetedChecked = false;
      selectedPayment = activeAttendee.payment || '';
      setTimeout(function() {
        var btn = document.getElementById('btn-checkin');
        if (btn) btn.style.display = selectedPayment === 'Comp' ? 'none' : '';
      }, 50);
      selectedAmount = parseInt(activeAttendee.fee) || null;
      if (!activeAttendee.worked_shifts) activeAttendee.worked_shifts = {};
      renderOverlay();
      document.getElementById('overlay-bg').classList.add('show');
      document.getElementById('overlay-box').scrollTop = 0;
      setTimeout(function() {
        var first = document.getElementById('overlay-box').querySelector('button');
        if (first) first.focus();
      }, 50);
    }

    function closeOverlay() {
      document.getElementById('overlay-bg').classList.remove('show');
      activeAttendee = null;
    }

    function renderOverlay() {
      var a = activeAttendee;
      var badge = '';
      if (a.prior === 'no' && a.accepted !== 'yes' && a.accepted !== true) badge = '<span class="badge badge-pending">New / Pending</span>';
      else if (a.accepted === 'yes' || a.accepted === true) badge = '<span class="badge badge-accepted">Accepted</span>';
      else badge = '<span class="badge badge-prior">Prior Attendee</span>';

      // Checked in status
      var checkedIn = a.did_attend ? '<span class="badge" style="background:#f0fdf4;color:#15803d;border:1px solid #16a34a;">Checked In ✓</span>' : '<span class="badge" style="background:#f5f4f1;color:#5a5a55;border:1px solid #b0aea6;">Not Checked In</span>';

      var isNew = a.prior === 'no';
      var html = checkedIn + ' ' + badge + '<br><br>';
      if (isNew) {
        html += '<div class="greeted-wrap" id="greeted-wrap" tabindex="0" onclick="toggleGreeted()" onkeydown="if(event.key===\'Enter\'||event.key===\' \')toggleGreeted()">'
             + '<div class="greeted-cb" id="greeted-cb"></div>'
             + '<span class="greeted-label" id="greeted-label">&#9733; First-time attendee &mdash; tap to confirm greeted</span>'
             + '</div>'
             + '<div class="greeted-error" id="greeted-error">Please confirm the attendee has been greeted before completing check-in.</div>';
      }

      // Identity grid — suppress empty fields
      var identityRows = '';
      if (a.fname) identityRows += '<span class="identity-label">Fetname</span><span class="identity-value">' + esc(a.fname) + '</span>';
      if (a.bname) identityRows += '<span class="identity-label">Facename</span><span class="identity-value">' + esc(a.bname) + '</span>';
      if (a.ipname) identityRows += '<span class="identity-label">Moniker</span><span class="identity-value">' + esc(a.ipname) + '</span>';
      html += '<div class="identity-grid">' + identityRows + '</div>';

      // Volunteer shifts
      if (a.volunteer && a.volunteer.trim()) {
        var shifts = a.volunteer.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if (shifts.length) {
          html += '<hr class="section-divider"><div class="section-heading">Volunteer shifts</div><div class="shift-btns">';
          shifts.forEach(function(s) {
            var worked = a.worked_shifts && a.worked_shifts[s];
            html += '<button class="shift-btn' + (worked ? ' worked' : '') + '" id="shift-' + a.row + '-' + encShift(s) + '" onclick="toggleShift(\'' + esc(s) + '\')" aria-pressed="' + (worked ? 'true' : 'false') + '">' + esc(s) + '</button>';
          });
          html += '</div>';
        }
      }

      // Payment method
      html += '<hr class="section-divider"><div class="section-heading">Payment method</div><div class="payment-btns">';
      PAYMENT_METHODS.forEach(function(m) {
        var sel = selectedPayment === m;
        var cls = 'payment-btn' + (m === 'Comp' ? ' comp-btn' : '') + (sel ? ' selected' : '');
        html += '<button class="' + cls + '" id="pay-' + m + '" onclick="selectPayment(\'' + m + '\')" aria-pressed="' + (sel ? 'true' : 'false') + '">' + esc(m) + '</button>';
      });
      html += '</div>';

      // Payment detail area
      html += '<div id="payment-detail"></div>';

      // Check In button
      html += '<button class="btn-checkin" id="btn-checkin" onclick="doCheckIn()">Check In</button>';
      html += '<button class="btn-cancel" onclick="closeOverlay()">Cancel</button>';
      html += '<div class="save-indicator" id="save-indicator"></div>';

      document.getElementById('overlay-content').innerHTML = html;
      renderPaymentDetail();
    }

    function selectPayment(method) {
      selectedPayment = method;
      selectedAmount = null;
      compAcknowledged = false;
      PAYMENT_METHODS.forEach(function(m) {
        var btn = document.getElementById('pay-' + m);
        if (!btn) return;
        var sel = m === method;
        var base = 'payment-btn' + (m === 'Comp' ? ' comp-btn' : '');
        btn.className = base + (sel ? ' selected' : '');
        btn.setAttribute('aria-pressed', sel ? 'true' : 'false');
      });
      // Open QR overlay for digital methods
      if (method === 'Venmo' || method === 'CashApp') {
        openQrPay(method);
        return;
      }
      // Hide main Check In button for Comp — flow handled by comp popup
      var checkinBtn = document.getElementById('btn-checkin');
      if (checkinBtn) checkinBtn.style.display = method === 'Comp' ? 'none' : '';
      renderPaymentDetail();
    }

    function openQrPay(method) {
      qrPayAmount = null;
      var qrFile = QR_FILES[method];
      var imgWrap = document.getElementById('qr-pay-img-wrap');
      var img = new Image();
      img.className = 'qr-pay-img';
      img.alt = method + ' QR code';
      img.onerror = function() {
        imgWrap.innerHTML = '<div class="qr-pay-placeholder">' + esc(qrFile) + '<br>not found</div>';
      };
      img.src = qrFile;
      imgWrap.innerHTML = '';
      imgWrap.appendChild(img);

      // Build amount buttons
      var amtHtml = '';
      [0,5,10,15,20].forEach(function(f) {
        amtHtml += '<button class="qr-pay-amount-btn" id="qramt-' + f + '" onclick="selectQrAmount(' + f + ')" aria-pressed="false">$' + f + '</button>';
      });
      document.getElementById('qr-pay-amount-btns').innerHTML = amtHtml;
      document.getElementById('btn-payment-confirmed').className = 'btn-payment-confirmed';

      document.getElementById('qr-pay-bg').classList.add('show');
      setTimeout(function() {
        var first = document.getElementById('qr-pay-amount-btns').querySelector('button');
        if (first) first.focus();
      }, 50);
    }

    function selectQrAmount(amt) {
      qrPayAmount = amt;
      [0,5,10,15,20].forEach(function(f) {
        var btn = document.getElementById('qramt-' + f);
        if (btn) { btn.className = 'qr-pay-amount-btn' + (f === amt ? ' selected' : ''); btn.setAttribute('aria-pressed', f === amt ? 'true' : 'false'); }
      });
      document.getElementById('btn-payment-confirmed').className = 'btn-payment-confirmed show';
      document.getElementById('btn-payment-confirmed').focus();
    }

    function confirmQrPayment() {
      if (!activeAttendee) return;
      if (activeAttendee.prior === 'no' && !greetedChecked) {
        closeQrPay();
        var err = document.getElementById('greeted-error');
        var wrap = document.getElementById('greeted-wrap');
        if (err) err.classList.add('show');
        if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      var row = activeAttendee.row;
      var fee = qrPayAmount !== null ? String(qrPayAmount).padStart(2,'0') : '00';
      var now = new Date();
      var chkday = now.toISOString().slice(0,10);
      var chktime = now.toTimeString().slice(0,8);
      var saves = [
        save(row, 'did_attend', 'yes'),
        save(row, 'payment', selectedPayment),
        save(row, 'fee', fee),
        save(row, 'chkday', chkday),
        save(row, 'chktime', chktime)
      ];
      if (activeAttendee.worked_shifts) {
        var worked = Object.keys(activeAttendee.worked_shifts).some(function(s) { return activeAttendee.worked_shifts[s]; });
        saves.push(save(row, 'did_volunteer', worked ? 'yes' : 'no'));
      }
      Promise.all(saves).then(function() {
        document.getElementById('qr-pay-bg').classList.remove('show');
        resetToSearch();
      });
    }

    function closeQrPay() {
      document.getElementById('qr-pay-bg').classList.remove('show');
      selectedPayment = '';
      PAYMENT_METHODS.forEach(function(m) {
        var btn = document.getElementById('pay-' + m);
        if (btn) { btn.className = 'payment-btn' + (m === 'Comp' ? ' comp-btn' : ''); btn.setAttribute('aria-pressed','false'); }
      });
      renderPaymentDetail();
    }

    function renderPaymentDetail() {
      var detail = document.getElementById('payment-detail');
      if (!detail) return;
      var html = '';

      if (!selectedPayment) { detail.innerHTML = ''; return; }

      if (selectedPayment === 'Comp') {
        html += '<div class="comp-disclaimer" id="comp-disclaimer" tabindex="0" onclick="acknowledgeComp()" onkeydown="if(event.key===\'Enter\'||event.key===\' \')acknowledgeComp()">' +
          '<div class="comp-disclaimer-title" id="comp-disc-title">Click to acknowledge — required</div>' +
          '<div class="comp-disclaimer-body">I confirm this attendee is authorized for complimentary entry and that this comp has been approved by event staff.</div>' +
        '</div>' +
        '<div class="comp-error-msg" id="comp-error-msg">You must acknowledge the disclaimer before checking in a comped attendee.</div>';
      } else if (selectedPayment === 'Cash') {
        html += '<hr class="section-divider"><div class="section-heading">Amount</div><div class="amount-btns">';
        [0,5,10,15,20].forEach(function(f) {
          var sel = selectedAmount === f;
          html += '<button class="amount-btn' + (sel ? ' selected' : '') + '" id="amt-' + f + '" onclick="selectAmount(' + f + ')" aria-pressed="' + (sel ? 'true' : 'false') + '">$' + f + '</button>';
        });
        html += '</div>';
      } else {
        var qrFile = QR_FILES[selectedPayment];
        html += '<div class="qr-wrap"><img src="' + qrFile + '" alt="' + esc(selectedPayment) + ' QR code" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="qr-placeholder" style="display:none;">QR not found<br>' + esc(qrFile) + '</div></div>';
        html += '<div class="section-heading">Amount</div><div class="amount-btns">';
        [0,5,10,15,20].forEach(function(f) {
          var sel = selectedAmount === f;
          html += '<button class="amount-btn' + (sel ? ' selected' : '') + '" id="amt-' + f + '" onclick="selectAmount(' + f + ')" aria-pressed="' + (sel ? 'true' : 'false') + '">$' + f + '</button>';
        });
        html += '</div>';
      }

      detail.innerHTML = html;
    }

    function selectAmount(amt) {
      selectedAmount = amt;
      [0,5,10,15,20].forEach(function(f) {
        var btn = document.getElementById('amt-' + f);
        if (btn) { btn.className = 'amount-btn' + (f === amt ? ' selected' : ''); btn.setAttribute('aria-pressed', f === amt ? 'true' : 'false'); }
      });
    }

    function acknowledgeComp() {
      compAcknowledged = true;
      var disc = document.getElementById('comp-disclaimer');
      var title = document.getElementById('comp-disc-title');
      var err = document.getElementById('comp-error-msg');
      if (disc) { disc.classList.remove('error'); disc.style.background = '#d1fae5'; disc.style.borderColor = '#16a34a'; }
      if (title) { title.style.color = '#15803d'; title.textContent = 'Acknowledged ✓'; }
      if (err) err.classList.remove('show');

      // Show comp popup
      var a = activeAttendee;
      var name = esc(a.fname || a.bname || 'this attendee');
      document.getElementById('comp-popup-body').textContent = 'This will mark ' + (a.fname || a.bname || 'this attendee') + ' as checked in with a $0 fee and log this as a comp.';
      document.getElementById('comp-popup-bg').classList.add('show');
      document.getElementById('btn-comp-confirm').focus();
    }

    function closeCompPopup() {
      document.getElementById('comp-popup-bg').classList.remove('show');
      compAcknowledged = false;
      var disc = document.getElementById('comp-disclaimer');
      var title = document.getElementById('comp-disc-title');
      if (disc) { disc.style.background = ''; disc.style.borderColor = ''; disc.classList.remove('error'); }
      if (title) { title.style.color = ''; title.textContent = 'Click to acknowledge — required'; }
    }

    function confirmComp() {
      if (!activeAttendee) return;
      if (activeAttendee.prior === 'no' && !greetedChecked) {
        closeCompPopup();
        var err = document.getElementById('greeted-error');
        var wrap = document.getElementById('greeted-wrap');
        if (err) err.classList.add('show');
        if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      var row = activeAttendee.row;
      document.getElementById('comp-popup-bg').classList.remove('show');
      var saves = [
        save(row, 'did_attend', 'yes'),
        save(row, 'fee', '00'),
        save(row, 'payment', 'Comp'),
      ];
      Promise.all(saves).then(function() { resetToSearch(); });
    }

    function doCheckIn() {
      if (!activeAttendee) return;
      var a = activeAttendee;

      // First-time attendee must be greeted
      if (activeAttendee.prior === 'no' && !greetedChecked) {
        var err = document.getElementById('greeted-error');
        var wrap = document.getElementById('greeted-wrap');
        if (err) err.classList.add('show');
        if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      if (selectedPayment === 'Comp') {
        if (!compAcknowledged) {
          var disc = document.getElementById('comp-disclaimer');
          var err = document.getElementById('comp-error-msg');
          if (disc) disc.classList.add('error');
          if (err) err.classList.add('show');
          if (disc) disc.scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        acknowledgeComp();
        return;
      }

      var now = new Date();
      var chkday = now.toISOString().slice(0,10);
      var chktime = now.toTimeString().slice(0,8);
      var saves = [save(a.row, 'did_attend', 'yes'), save(a.row, 'chkday', chkday), save(a.row, 'chktime', chktime)];
      if (selectedPayment) saves.push(save(a.row, 'payment', selectedPayment));
      if (selectedAmount !== null) saves.push(save(a.row, 'fee', String(selectedAmount).padStart(2,'0')));

      // Save volunteer shifts
      if (a.worked_shifts) {
        var worked = Object.keys(a.worked_shifts).some(function(s) { return a.worked_shifts[s]; });
        saves.push(save(a.row, 'did_volunteer', worked ? 'yes' : 'no'));
      }

      Promise.all(saves).then(function() { resetToSearch(); });
    }

    function toggleShift(shift) {
      var a = activeAttendee;
      if (!a) return;
      if (!a.worked_shifts) a.worked_shifts = {};
      a.worked_shifts[shift] = !a.worked_shifts[shift];
      var btn = document.getElementById('shift-' + a.row + '-' + encShift(shift));
      if (btn) { btn.classList.toggle('worked', a.worked_shifts[shift]); btn.setAttribute('aria-pressed', a.worked_shifts[shift] ? 'true' : 'false'); }
    }

    function save(row, field, value) {
      return fetch(buildUrl({ action: 'updateAttendee', row: row, field: field, value: value }))
        .then(function(r) { return r.json(); });
    }

    function showSaved() {
      var el = document.getElementById('save-indicator');
      if (!el) return;
      el.textContent = '✓ Saved';
      el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 1800);
    }

    function clearResults() {
      document.getElementById('intro-bg').classList.remove('show');
      document.getElementById('allnames-bg').classList.remove('show');
      document.getElementById('search').value = '';
      document.getElementById('results-container').innerHTML = '';
      document.getElementById('sort-row').style.display = 'none';
      document.getElementById('clear-btn').style.display = 'none';
      currentResults = [];
      document.getElementById('search').focus();
    }

    function toggleGreeted() {
      // If not yet greeted, open intro popup first
      if (!greetedChecked) {
        document.getElementById('intro-bg').classList.add('show');
        setTimeout(function() {
          var first = document.querySelector('.intro-opt');
          if (first) first.focus();
        }, 50);
      } else {
        // Allow unchecking directly
        greetedChecked = false;
        var wrap = document.getElementById('greeted-wrap');
        var cb   = document.getElementById('greeted-cb');
        var lbl  = document.getElementById('greeted-label');
        if (wrap) wrap.classList.remove('done');
        if (cb)   cb.textContent = '';
        if (lbl)  lbl.textContent = '★ First-time attendee — tap to confirm greeted';
      }
    }

    function resolveIntro(choice) {
      document.getElementById('intro-bg').classList.remove('show');
      // Mark greeted and update UI
      greetedChecked = true;
      var wrap = document.getElementById('greeted-wrap');
      var cb   = document.getElementById('greeted-cb');
      var lbl  = document.getElementById('greeted-label');
      var err  = document.getElementById('greeted-error');
      if (wrap) wrap.classList.add('done');
      if (cb)   cb.textContent = '✓';
      if (lbl)  lbl.textContent = choice === 'prior'
        ? '★ First-time attendee — attending with prior attendee'
        : '★ First-time attendee — staff notified';
      if (err)  err.classList.remove('show');
    }

    function openAllNames(row) {
      var a = allAttendees.find(function(x) { return x.row === row; });
      if (!a) return;
      allNamesRow = row;
      var grid = document.getElementById('allnames-grid');
      var html = '';
      if (a.fname) html += '<span class="allnames-label">Fetname</span><span class="allnames-value">' + esc(a.fname) + '</span>';
      if (a.bname) html += '<span class="allnames-label">Facename</span><span class="allnames-value">' + esc(a.bname) + '</span>';
      if (a.ipname) html += '<span class="allnames-label">Moniker</span><span class="allnames-value">' + esc(a.ipname) + '</span>';
      if (!html) html = '<span class="allnames-label" style="grid-column:1/-1;color:#8a8880;">No names on record.</span>';
      grid.innerHTML = html;
      document.getElementById('allnames-bg').classList.add('show');
      document.getElementById('btn-allnames-confirm').focus();
    }

    function closeAllNames() {
      document.getElementById('allnames-bg').classList.remove('show');
      allNamesRow = null;
    }

    function confirmAllNames() {
      var row = allNamesRow;
      closeAllNames();
      if (row) openOverlay(row);
    }

    function resetToSearch() {
      document.getElementById('overlay-bg').classList.remove('show');
      document.getElementById('comp-popup-bg').classList.remove('show');
      document.getElementById('search').value = '';
      document.getElementById('results-container').innerHTML = '';
      document.getElementById('sort-row').style.display = 'none';
      currentResults = [];
      activeAttendee = null;
      loaded = false;
      document.getElementById('search').focus();
    }

    // Close overlay on background click
    document.getElementById('overlay-bg').addEventListener('click', function(e) {
      if (e.target === this) closeOverlay();
    });

    // Escape key handling
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('intro-bg').classList.contains('show')) { return; } // intro must be resolved, no escape
        if (document.getElementById('allnames-bg').classList.contains('show')) { closeAllNames(); return; }
        if (document.getElementById('qr-pay-bg').classList.contains('show')) { closeQrPay(); return; }
        if (document.getElementById('comp-popup-bg').classList.contains('show')) { closeCompPopup(); return; }
        if (document.getElementById('overlay-bg').classList.contains('show')) { closeOverlay(); return; }
      }
    });
    // ── PIN AUTHENTICATION ──
    function submitPin() {
      var pin = document.getElementById('pin-input').value.trim();
      var err = document.getElementById('pin-error');
      var btn = document.querySelector('.pin-submit');

      if (pin.length !== 8) {
        err.textContent = 'PIN must be 8 digits.';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="pin-spinner"></span>Checking...';
      err.textContent = '';

      fetch(buildUrl({ action: 'verifyPin', pin: pin, page: 'checkin' }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            document.getElementById('pin-screen').style.display = 'none';
          } else {
            err.textContent = data.message || 'Incorrect PIN.';
            btn.disabled = false;
            btn.textContent = 'Unlock';
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
          }
        })
        .catch(function() {
          err.textContent = 'Could not reach server. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Unlock';
        });
    }

    document.getElementById('pin-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitPin();
    });

  </script>
</body>
</html>
