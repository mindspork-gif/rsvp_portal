<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f4f1;
      color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 80px;
    }

    header { width: 100%; max-width: 640px; margin-bottom: 24px; border-bottom: 1.5px solid #c8c6be; padding-bottom: 18px; }
    .logo-line { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: #5a5a55; margin-bottom: 6px; font-weight: 500; }
    h1 { font-size: 26px; font-weight: 600; color: #1a1a18; }
    h1 span { color: #2563eb; }
    .event-name { font-size: 15px; color: #5a5a55; margin-top: 4px; }

    /* Search */
    .search-wrap { width: 100%; max-width: 640px; display: flex; gap: 8px; margin-bottom: 20px; }
    .search-input {
      flex: 1;
      background: #ffffff;
      border: 1.5px solid #b0aea6;
      color: #1a1a18;
      font-size: 17px;
      padding: 12px 16px;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .search-btn {
      padding: 12px 22px;
      background: #2563eb;
      border: none;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .search-btn:hover { background: #1d4ed8; }

    /* Results */
    .results-label { width: 100%; max-width: 640px; font-size: 13px; color: #5a5a55; margin-bottom: 12px; }
    .results-label strong { color: #1a1a18; }

    .attendee-list { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 12px; }

    .attendee-card {
      background: #ffffff;
      border: 1.5px solid #c8c6be;
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color 0.15s;
    }
    .attendee-card.checked-in { border-color: #16a34a; background: #f0fdf4; }

    .attendee-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
    .attendee-names { flex: 1; }
    .name-primary { font-size: 18px; font-weight: 600; color: #1a1a18; }
    .name-secondary { font-size: 14px; color: #5a5a55; margin-top: 3px; }

    .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 20px; white-space: nowrap; letter-spacing: 0.04em; }
    .badge-pending  { background: #fffbeb; color: #b45309; border: 1px solid #d97706; }
    .badge-accepted { background: #eff6ff; color: #1d4ed8; border: 1px solid #2563eb; }
    .badge-prior    { background: #f0fdf4; color: #15803d; border: 1px solid #16a34a; }

    /* Controls row */
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* Check-in button */
    .checkin-btn {
      padding: 9px 16px;
      background: #f5f4f1;
      border: 1.5px solid #b0aea6;
      color: #1a1a18;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .checkin-btn:hover { border-color: #16a34a; color: #15803d; background: #f0fdf4; }
    .checkin-btn.checked { background: #f0fdf4; border-color: #16a34a; color: #15803d; }
    .checkin-btn .cb { width: 18px; height: 18px; border: 1.5px solid #b0aea6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; flex-shrink: 0; }
    .checkin-btn.checked .cb { background: #16a34a; border-color: #16a34a; color: #fff; }

    /* Volunteer shifts */
    .volunteer-section { margin-top: 10px; }
    .volunteer-label { font-size: 13px; font-weight: 600; color: #5a5a55; margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.08em; }
    .shift-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .shift-btn {
      padding: 7px 12px;
      background: #f5f4f1;
      border: 1.5px solid #b0aea6;
      color: #3a3a36;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .shift-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .shift-btn.worked { background: #eff6ff; border-color: #2563eb; color: #1d4ed8; }

    /* Fee */
    .fee-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .fee-label { font-size: 15px; font-weight: 500; color: #1a1a18; }
    .fee-options { display: flex; gap: 4px; }
    .fee-btn { padding: 7px 11px; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #3a3a36; font-size: 14px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .fee-btn:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .fee-btn.selected { background: #2563eb; color: #ffffff; border-color: #2563eb; }

    .divider-line { border: none; border-top: 1px solid #e0ded8; margin: 12px 0; }

    .save-indicator { font-size: 13px; color: #16a34a; font-weight: 500; opacity: 0; transition: opacity 0.3s; margin-top: 8px; height: 18px; }
    .save-indicator.show { opacity: 1; }

    .empty-state { width: 100%; max-width: 640px; text-align: center; padding: 48px 20px; color: #8a8880; font-size: 16px; }
    .loading { text-align: center; padding: 48px 20px; color: #5a5a55; font-size: 16px; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #b0aea6; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .complete-btn {
      width: 100%;
      max-width: 640px;
      margin-top: 20px;
      padding: 14px;
      background: transparent;
      border: 1.5px solid #b0aea6;
      color: #5a5a55;
      font-size: 17px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      display: none;
    }
    .complete-btn:hover { border-color: #1a1a18; color: #1a1a18; background: #e8e6df; }
    footer { margin-top: 40px; font-size: 13px; color: #8a8880; }
  </style>
</head>
<body>

  <header>
    <div class="logo-line">Admin // Check-In</div>
    <h1>Event <span>Check-In</span></h1>
    <div class="event-name" id="event-name">&nbsp;</div>
  </header>

  <div class="search-wrap">
    <input class="search-input" type="text" id="search" placeholder="Fetname, facename, or moniker..." autocomplete="off"
      onkeydown="if(event.key==='Enter') doSearch()" />
    <button class="search-btn" onclick="doSearch()">Search</button>
  </div>

  <div class="results-label" id="results-label"></div>
  <div id="attendee-list" class="attendee-list"></div>

  <button class="complete-btn" id="complete-btn" onclick="resetPage()">Complete &amp; Clear</button>

  <footer>Check-in portal &mdash; admin use only</footer>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbzR86hw389rrdPFnlOR1l41Vmv9jtRby9yNugMJCpc710tbpX_6Wmzw1YTGUABYLN1nLA/exec';
    var allAttendees = [];
    var loaded = false;

    function buildUrl(params) {
      var parts = Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      });
      return API_URL + '?' + parts.join('&');
    }

    function loadAttendees(cb) {
      if (loaded) { cb(); return; }
      fetch(buildUrl({ action: 'getAttendees' }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) {
            document.getElementById('attendee-list').innerHTML = '<div class="empty-state">' + data.message + '</div>';
            return;
          }
          document.getElementById('event-name').textContent = data.eventName;
          allAttendees = data.attendees;
          loaded = true;
          cb();
        })
        .catch(function() {
          document.getElementById('attendee-list').innerHTML = '<div class="empty-state">Could not load attendees. Check your connection.</div>';
        });
    }

    function doSearch() {
      var q = document.getElementById('search').value.trim().toLowerCase();
      if (!q) {
        document.getElementById('results-label').innerHTML = '';
        document.getElementById('attendee-list').innerHTML = '';
        return;
      }

      document.getElementById('attendee-list').innerHTML = '<div class="loading"><span class="spinner"></span>Searching...</div>';

      loadAttendees(function() {
        var results = allAttendees.filter(function(a) {
          return a.fname.toLowerCase().includes(q) ||
                 a.bname.toLowerCase().includes(q) ||
                 a.ipname.toLowerCase().includes(q);
        });

        var label = document.getElementById('results-label');
        if (results.length === 0) {
          label.innerHTML = '';
          document.getElementById('attendee-list').innerHTML = '<div class="empty-state">No matches found for &ldquo;' + escapeHtml(q) + '&rdquo;.</div>';
        } else {
          label.innerHTML = 'Found <strong>' + results.length + '</strong> match' + (results.length !== 1 ? 'es' : '');
          var list = document.getElementById('attendee-list');
          list.innerHTML = '';
          results.forEach(function(a) { list.appendChild(buildCard(a)); });
          document.getElementById('complete-btn').style.display = 'block';
        }
      });
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function buildCard(a) {
      var card = document.createElement('div');
      card.className = 'attendee-card' + (a.did_attend ? ' checked-in' : '');
      card.id = 'card-' + a.row;

      // Badge
      var badge = '';
      if (a.prior === 'no' && a.accepted !== 'yes' && a.accepted !== true) {
        badge = '<span class="badge badge-pending">New / Pending</span>';
      } else if (a.accepted === 'yes' || a.accepted === true) {
        badge = '<span class="badge badge-accepted">Accepted</span>';
      } else {
        badge = '<span class="badge badge-prior">Prior Attendee</span>';
      }

      // Secondary names
      var secondary = [];
      if (a.bname) secondary.push('Facename: ' + escapeHtml(a.bname));
      if (a.ipname) secondary.push(escapeHtml(a.ipname));

      // Fee
      var currentFee = parseInt(a.fee) || 0;

      // Volunteer shifts — only show if they signed up
      var volunteerHtml = '';
      if (a.volunteer && a.volunteer.trim() !== '') {
        var shifts = a.volunteer.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        if (shifts.length > 0) {
          var shiftBtns = shifts.map(function(s) {
            var worked = a.worked_shifts && a.worked_shifts[s];
            return '<button class="shift-btn' + (worked ? ' worked' : '') + '" id="shift-' + a.row + '-' + encodeShift(s) + '" onclick="toggleShift(' + a.row + ', \'' + escapeHtml(s) + '\')">' + escapeHtml(s) + '</button>';
          }).join('');
          volunteerHtml =
            '<div class="volunteer-section">' +
              '<div class="volunteer-label">Volunteer shifts</div>' +
              '<div class="shift-btns">' + shiftBtns + '</div>' +
            '</div>';
        }
      }

      card.innerHTML =
        '<div class="attendee-header">' +
          '<div class="attendee-names">' +
            '<div class="name-primary">' + escapeHtml(a.fname || a.bname || 'Unknown') + '</div>' +
            (secondary.length ? '<div class="name-secondary">' + secondary.join(' &nbsp;&middot;&nbsp; ') + '</div>' : '') +
          '</div>' +
          badge +
        '</div>' +

        '<div class="controls">' +
          '<button class="checkin-btn' + (a.did_attend ? ' checked' : '') + '" id="checkin-btn-' + a.row + '" onclick="toggleAttend(' + a.row + ')">' +
            '<span class="cb">' + (a.did_attend ? '&#10003;' : '') + '</span>' +
            '<span>' + (a.did_attend ? 'Checked In' : 'Check In') + '</span>' +
          '</button>' +
        '</div>' +

        (volunteerHtml ? '<hr class="divider-line">' + volunteerHtml : '') +

        '<hr class="divider-line">' +
        '<div class="fee-row">' +
          '<span class="fee-label">Fee $</span>' +
          '<div class="fee-options">' +
            [0, 5, 10, 15, 20].map(function(f) {
              return '<button class="fee-btn' + (currentFee === f ? ' selected' : '') + '" id="fee-' + a.row + '-' + f + '" onclick="setFee(' + a.row + ',' + f + ')">' + f + '</button>';
            }).join('') +
          '</div>' +
        '</div>' +

        '<div class="save-indicator" id="saved-' + a.row + '">&#10003; Saved</div>';

      // Init worked_shifts tracker on the attendee object
      if (!a.worked_shifts) a.worked_shifts = {};

      return card;
    }

    function encodeShift(s) {
      return s.replace(/[^a-zA-Z0-9]/g, '_');
    }

    function getAttendeeByRow(row) {
      return allAttendees.find(function(a) { return a.row === row; });
    }

    function showSaved(row) {
      var el = document.getElementById('saved-' + row);
      if (!el) return;
      el.classList.add('show');
      setTimeout(function() { el.classList.remove('show'); }, 1800);
    }

    function save(row, field, value) {
      fetch(buildUrl({ action: 'updateAttendee', row: row, field: field, value: value }))
        .then(function(r) { return r.json(); })
        .then(function(data) { if (data.success) showSaved(row); });
    }

    function toggleAttend(row) {
      var a = getAttendeeByRow(row);
      if (!a) return;
      a.did_attend = !a.did_attend;
      var btn  = document.getElementById('checkin-btn-' + row);
      var card = document.getElementById('card-' + row);
      if (btn) {
        btn.className = 'checkin-btn' + (a.did_attend ? ' checked' : '');
        btn.innerHTML = '<span class="cb">' + (a.did_attend ? '&#10003;' : '') + '</span><span>' + (a.did_attend ? 'Checked In' : 'Check In') + '</span>';
      }
      if (card) card.classList.toggle('checked-in', a.did_attend);
      save(row, 'did_attend', a.did_attend ? 'yes' : 'no');
    }

    function toggleShift(row, shift) {
      var a = getAttendeeByRow(row);
      if (!a) return;
      if (!a.worked_shifts) a.worked_shifts = {};
      a.worked_shifts[shift] = !a.worked_shifts[shift];

      var btn = document.getElementById('shift-' + row + '-' + encodeShift(shift));
      if (btn) btn.classList.toggle('worked', a.worked_shifts[shift]);

      // Build comma-separated list of worked shifts and save to did_volunteer field
      var worked = Object.keys(a.worked_shifts).filter(function(s) { return a.worked_shifts[s]; });
      a.did_volunteer = worked.length > 0;
      save(row, 'did_volunteer', a.did_volunteer ? 'yes' : 'no');
    }

    function setFee(row, fee) {
      var a = getAttendeeByRow(row);
      if (!a) return;
      a.fee = fee;
      [0, 5, 10, 15, 20].forEach(function(f) {
        var btn = document.getElementById('fee-' + row + '-' + f);
        if (btn) btn.classList.toggle('selected', f === fee);
      });
      save(row, 'fee', String(fee).padStart(2, '0'));
    }
    function resetPage() {
      document.getElementById('search').value = '';
      document.getElementById('attendee-list').innerHTML = '';
      document.getElementById('results-label').innerHTML = '';
      document.getElementById('complete-btn').style.display = 'none';
      document.getElementById('search').focus();
    }

  </script>
</body>
</html>
