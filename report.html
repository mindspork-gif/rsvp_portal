<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f4f1;
      color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      padding: 36px 24px 80px;
    }

    /* PIN screen */
    .pin-screen { display: flex; position: fixed; inset: 0; background: #f5f4f1; z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .pin-box { background: #fff; border: 1.5px solid #c8c6be; border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 400px; text-align: center; }
    .pin-logo { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #5a5a55; margin-bottom: 8px; font-weight: 500; }
    .pin-title { font-size: 22px; font-weight: 600; color: #1a1a18; margin-bottom: 6px; }
    .pin-title span { color: #2563eb; }
    .pin-subtitle { font-size: 14px; color: #8a8880; margin-bottom: 28px; }
    .pin-input { width: 100%; background: #f5f4f1; border: 1.5px solid #b0aea6; color: #1a1a18; font-size: 28px; letter-spacing: 0.4em; padding: 14px; border-radius: 10px; outline: none; text-align: center; font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s; margin-bottom: 16px; }
    .pin-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .pin-submit { width: 100%; padding: 14px; background: #2563eb; border: none; color: #fff; font-size: 17px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
    .pin-submit:hover { background: #1d4ed8; }
    .pin-error { font-size: 14px; color: #b91c1c; font-weight: 500; margin-top: 12px; min-height: 20px; }
    .pin-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }

    /* Layout */
    .page { max-width: 960px; margin: 0 auto; }
    header { margin-bottom: 28px; border-bottom: 1.5px solid #c8c6be; padding-bottom: 18px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo-line { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #5a5a55; margin-bottom: 6px; font-weight: 500; }
    h1 { font-size: 26px; font-weight: 600; color: #1a1a18; }
    h1 span { color: #2563eb; }

    /* Event selector */
    .event-select { background: #fff; border: 1.5px solid #b0aea6; color: #1a1a18; font-size: 16px; padding: 10px 14px; border-radius: 8px; outline: none; cursor: pointer; font-family: inherit; min-width: 220px; }
    .event-select:focus { border-color: #2563eb; }

    /* Section cards */
    .section { background: #fff; border: 1.5px solid #c8c6be; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .section-title { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #5a5a55; margin-bottom: 18px; }

    /* Stat grid */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-box { background: #f5f4f1; border-radius: 10px; padding: 16px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: #1a1a18; line-height: 1; margin-bottom: 4px; }
    .stat-value.accent { color: #2563eb; }
    .stat-value.green { color: #16a34a; }
    .stat-label { font-size: 12px; color: #5a5a55; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }

    /* Window stats */
    .window-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .window-chip { flex: 1; min-width: 140px; background: #f5f4f1; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .window-chip-label { font-size: 13px; color: #5a5a55; font-weight: 500; }
    .window-chip-value { font-size: 20px; font-weight: 700; color: #1a1a18; }
    .window-chip.highlight-week { border-left: 3px solid #f59e0b; }
    .window-chip.highlight-three { border-left: 3px solid #ef4444; }
    .window-chip.highlight-door { border-left: 3px solid #8b5cf6; }

    /* At door list */
    .at-door-list { margin-top: 12px; font-size: 14px; color: #5a5a55; }

    /* Volunteer table */
    .vol-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .vol-table th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #5a5a55; padding: 8px 12px; border-bottom: 1.5px solid #e0ded8; }
    .vol-table td { padding: 10px 12px; border-bottom: 1px solid #f0ede8; }
    .vol-table tr:last-child td { border-bottom: none; }
    .vol-pct { font-size: 12px; color: #8a8880; margin-left: 6px; }

    /* Payment table */
    .pay-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .pay-table th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #5a5a55; padding: 8px 12px; border-bottom: 1.5px solid #e0ded8; }
    .pay-table td { padding: 10px 12px; border-bottom: 1px solid #f0ede8; }
    .pay-table tr:last-child td { border-bottom: none; }
    .pay-total-row td { font-weight: 600; color: #1a1a18; border-top: 1.5px solid #e0ded8; }

    /* Charts */
    .chart-wrap { position: relative; height: 280px; }

    /* Loading / empty */
    .loading { text-align: center; padding: 60px 20px; color: #5a5a55; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #b0aea6; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .placeholder { text-align: center; padding: 48px; color: #8a8880; font-size: 15px; }

    footer { margin-top: 40px; font-size: 13px; color: #8a8880; text-align: center; }
  </style>
</head>
<body>

  <!-- PIN screen -->
  <div class="pin-screen" id="pin-screen">
    <div class="pin-box">
      <p class="pin-logo">Admin // Reports</p>
      <h1 class="pin-title">Event <span>Reports</span></h1>
      <p class="pin-subtitle">Enter your 8-digit access PIN to continue</p>
      <input class="pin-input" type="password" id="pin-input" maxlength="8" placeholder="••••••••"
        autocomplete="off" inputmode="numeric" pattern="[0-9]*"
        onkeydown="if(event.key==='Enter') submitPin()" />
      <button class="pin-submit" id="pin-submit" onclick="submitPin()">Unlock</button>
      <p class="pin-error" id="pin-error"></p>
    </div>
  </div>

  <div class="page">
    <header>
      <div>
        <p class="logo-line">Admin // Reports</p>
        <h1>Event <span>Report</span></h1>
      </div>
      <select class="event-select" id="event-select" onchange="loadReport()" style="display:none;">
        <option value="">Select an event...</option>
      </select>
    </header>

    <div id="report-body"><div class="placeholder">Select an event to load the report.</div></div>
  </div>

  <footer>Reports portal &mdash; admin use only</footer>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbzR86hw389rrdPFnlOR1l41Vmv9jtRby9yNugMJCpc710tbpX_6Wmzw1YTGUABYLN1nLA/exec';
    var rsvpChart = null, arrivalChart = null;

    function buildUrl(params) {
      return API_URL + '?' + Object.keys(params).map(function(k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
      }).join('&');
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function pct(a, b) { return b > 0 ? (a / b * 100).toFixed(1) + '%' : '—'; }

    function fmt$(n) { return '$' + (n || 0); }

    // ── PIN ──
    function submitPin() {
      var pin = document.getElementById('pin-input').value.trim();
      var err = document.getElementById('pin-error');
      var btn = document.getElementById('pin-submit');
      if (pin.length !== 8) { err.textContent = 'PIN must be 8 digits.'; return; }
      btn.disabled = true;
      btn.innerHTML = '<span class="pin-spinner"></span>Checking...';
      err.textContent = '';
      fetch(buildUrl({ action: 'verifyPin', pin: pin, page: 'report' }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            document.getElementById('pin-screen').style.display = 'none';
            loadEventList();
          } else {
            err.textContent = data.message || 'Incorrect PIN.';
            btn.disabled = false;
            btn.textContent = 'Unlock';
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').focus();
          }
        })
        .catch(function() {
          err.textContent = 'Could not reach server. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Unlock';
        });
    }

    // ── EVENT LIST ──
    function loadEventList() {
      fetch(buildUrl({ action: 'getEventList' }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) return;
          var sel = document.getElementById('event-select');
          data.events.forEach(function(e) {
            var opt = document.createElement('option');
            opt.value = e.tab;
            opt.textContent = e.name + ' (' + e.tab + ')';
            sel.appendChild(opt);
          });
          sel.style.display = 'block';
        });
    }

    // ── LOAD REPORT ──
    function loadReport() {
      var tab = document.getElementById('event-select').value;
      if (!tab) { document.getElementById('report-body').innerHTML = '<div class="placeholder">Select an event to load the report.</div>'; return; }
      document.getElementById('report-body').innerHTML = '<div class="loading"><span class="spinner"></span>Loading report...</div>';
      if (rsvpChart)    { rsvpChart.destroy();    rsvpChart = null; }
      if (arrivalChart) { arrivalChart.destroy(); arrivalChart = null; }

      fetch(buildUrl({ action: 'getEventReport', tab: tab }))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data.success) {
            document.getElementById('report-body').innerHTML = '<div class="placeholder">' + esc(data.message) + '</div>';
            return;
          }
          renderReport(data);
        })
        .catch(function() {
          document.getElementById('report-body').innerHTML = '<div class="placeholder">Could not load report. Check connection.</div>';
        });
    }

    // ── RENDER REPORT ──
    function renderReport(d) {
      var body = document.getElementById('report-body');
      var attendancePct = pct(d.attended, d.total);

      var html = '';

      // ── Attendance stats ──
      html += '<div class="section">';
      html += '<div class="section-title">Attendance</div>';
      html += '<div class="stat-grid">';
      html += '<div class="stat-box"><div class="stat-value accent">' + attendancePct + '</div><div class="stat-label">Attendance rate</div></div>';
      html += '<div class="stat-box"><div class="stat-value">' + d.total + '</div><div class="stat-label">Total RSVPs</div></div>';
      html += '<div class="stat-box"><div class="stat-value green">' + d.attended + '</div><div class="stat-label">Attended</div></div>';
      html += '<div class="stat-box"><div class="stat-value">' + d.newRsvp + '</div><div class="stat-label">New RSVPs</div></div>';
      html += '<div class="stat-box"><div class="stat-value green">' + d.newAttended + '</div><div class="stat-label">New — Attended</div></div>';
      html += '</div>';

      // Window stats
      html += '<div class="window-row">';
      html += '<div class="window-chip highlight-week"><span class="window-chip-label">One Week RSVPs</span><span class="window-chip-value">' + d.oneWeekCount + '</span></div>';
      html += '<div class="window-chip highlight-three"><span class="window-chip-label">Three Day RSVPs</span><span class="window-chip-value">' + d.threeDayCount + '</span></div>';
      html += '<div class="window-chip highlight-door"><span class="window-chip-label">At Door RSVPs</span><span class="window-chip-value">' + d.atDoorCount + '</span></div>';
      html += '</div>';
      html += '</div>';

      // ── RSVP over time chart ──
      html += '<div class="section">';
      html += '<div class="section-title">RSVP volume over time</div>';
      html += '<div class="chart-wrap"><canvas id="rsvp-chart"></canvas></div>';
      html += '</div>';

      // ── Volunteer ──
      var shifts = ['Week Before','Day Before','Day of Before','Day of During','Day of After'];
      html += '<div class="section">';
      html += '<div class="section-title">Volunteer shifts</div>';
      html += '<table class="vol-table"><thead><tr><th>Shift</th><th>Pledged</th><th>Logged</th></tr></thead><tbody>';
      shifts.forEach(function(s) {
        var v = d.volunteerStats[s] || { pledged: 0, logged: 0 };
        html += '<tr><td>' + esc(s) + '</td><td>' + v.pledged + '</td><td>' + v.logged + '<span class="vol-pct">' + pct(v.logged, v.pledged) + '</span></td></tr>';
      });
      html += '</tbody></table></div>';

      // ── Payment ──
      var payMethods = ['Cash','CashApp','Venmo'];
      var grandTotal = 0;
      html += '<div class="section">';
      html += '<div class="section-title">Revenue</div>';
      html += '<table class="pay-table"><thead><tr><th>Method</th><th>Count</th><th>Total</th></tr></thead><tbody>';
      payMethods.forEach(function(m) {
        var p = d.paymentStats[m] || { count: 0, total: 0 };
        grandTotal += p.total;
        html += '<tr><td>' + esc(m) + '</td><td>' + p.count + '</td><td>' + fmt$(p.total) + '</td></tr>';
      });
      var comp = d.paymentStats['Comp'] || { count: 0 };
      html += '<tr><td>Comp</td><td>' + comp.count + '</td><td>—</td></tr>';
      html += '<tr class="pay-total-row"><td>Total</td><td></td><td>' + fmt$(grandTotal) + '</td></tr>';
      html += '</tbody></table></div>';

      // ── Arrival graph ──
      html += '<div class="section">';
      html += '<div class="section-title">Arrival times (16:00 – 02:00)</div>';
      html += '<div class="chart-wrap"><canvas id="arrival-chart"></canvas></div>';
      html += '</div>';

      body.innerHTML = html;

      // Draw charts after DOM update
      setTimeout(function() {
        drawRsvpChart(d);
        drawArrivalChart(d);
      }, 50);
    }

    // ── RSVP CHART ──
    function drawRsvpChart(d) {
      if (!d.rsvpTimeline.length) return;
      var eventStart = d.eventStartMs;

      var labels = [], counts = [], bgColors = [];
      d.rsvpTimeline.forEach(function(ts, i) {
        var dt = new Date(ts);
        labels.push(dt.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        counts.push(i + 1);
        var diffHrs = eventStart ? (eventStart - ts) / 3600000 : 999;
        if (diffHrs <= 24)       bgColors.push('rgba(139,92,246,0.85)');
        else if (diffHrs <= 72)  bgColors.push('rgba(239,68,68,0.85)');
        else if (diffHrs <= 168) bgColors.push('rgba(245,158,11,0.85)');
        else                     bgColors.push('rgba(37,99,235,0.6)');
      });

      var ctx = document.getElementById('rsvp-chart').getContext('2d');
      rsvpChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cumulative RSVPs',
            data: counts,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37,99,235,0.08)',
            borderWidth: 2,
            pointBackgroundColor: bgColors,
            pointRadius: 5,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(item) { return 'RSVPs: ' + item.parsed.y; }
              }
            }
          },
          scales: {
            x: {
              grid: { color: '#f0ede8' },
              ticks: { color: '#5a5a55', maxTicksLimit: 10, maxRotation: 30 }
            },
            y: { beginAtZero: true, grid: { color: '#f0ede8' }, ticks: { color: '#5a5a55', stepSize: 1 } }
          }
        }
      });
    }

    // ── ARRIVAL CHART ──
    function drawArrivalChart(d) {
      if (!d.arrivals.length) return;

      var STAY_MS   = 210 * 60 * 1000;
      var eventDate = d.eventDate || new Date().toISOString().slice(0,10);
      var parts     = eventDate.split('-');

      var start16 = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]), 16, 0, 0).getTime();
      var end02   = start16 + (10 * 60 * 60 * 1000);
      var bucketMs = 15 * 60 * 1000;
      var buckets = [], labels = [];
      for (var t = start16; t <= end02; t += bucketMs) {
        buckets.push(t);
        var dt = new Date(t);
        labels.push(dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }));
      }

      var rawCounts = [], occupancyCounts = [];
      buckets.forEach(function(bt) {
        rawCounts.push(d.arrivals.filter(function(a) { return a <= bt; }).length);
        occupancyCounts.push(d.arrivals.filter(function(a) { return a <= bt && (a + STAY_MS) > bt; }).length);
      });

      var ctx = document.getElementById('arrival-chart').getContext('2d');
      arrivalChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Cumulative arrivals',
              data: rawCounts,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37,99,235,0.06)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointRadius: 2
            },
            {
              label: 'Est. occupancy (210 min)',
              data: occupancyCounts,
              borderColor: '#16a34a',
              backgroundColor: 'rgba(22,163,74,0.06)',
              borderWidth: 2,
              fill: true,
              tension: 0.3,
              pointRadius: 2,
              borderDash: [5,3]
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, labels: { color: '#1a1a18', font: { size: 13 } } }
          },
          scales: {
            x: {
              grid: { color: '#f0ede8' },
              ticks: { color: '#5a5a55', maxTicksLimit: 12, maxRotation: 0 }
            },
            y: { beginAtZero: true, grid: { color: '#f0ede8' }, ticks: { color: '#5a5a55', stepSize: 1 } }
          }
        }
      });
    }
  </script>
</body>
</html>
